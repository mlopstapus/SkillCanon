name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Standard per-job step sequence for any job that needs pnpm/Node (lint, typecheck,
# test, build — not docker-build, which builds entirely inside the Docker build
# context): actions/checkout, pnpm/action-setup (version read from package.json's
# packageManager field), actions/setup-node (node-version read from package.json's
# engines.node field, with pnpm store caching), then `pnpm install --frozen-lockfile`.
# No `services:` Postgres block is used anywhere in this file — the test job's
# Testcontainers-backed tests self-provision an ephemeral Postgres container per
# test file via the existing startTestDb() helper; the runner only needs Docker,
# which ubuntu-latest ships with by default. See specs/004-ci-pipeline/research.md
# Decision 2.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .

  # Quickstart smoke test: the README path (docker compose up) followed by the
  # browser walk and the CLI steps in e2e/. Needs a fresh database.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir cli install --frozen-lockfile
      - run: pnpm --dir cli run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose up -d --build
      - name: Wait for the app
        # curl's own --retry skips connection resets (exit 56) while the app boots.
        run: |
          for _ in $(seq 60); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 2
          done
          exit 1
      # The browser runs in a non-UTC zone so locale-dependent rendering matches
      # a developer's machine; on a UTC runner the audit-log hydration defect
      # (015/007, an it.fails marker) would otherwise never show.
      - run: pnpm test:e2e
        env:
          TZ: America/New_York
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Single required check for main's branch protection (contracts/required-check.md).
  # Constituent jobs above may be renamed/split/added without touching branch
  # protection settings, as long as this job's `needs:` list is kept in sync.
  ci-gate:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, docker-build, e2e]
    steps:
      - run: echo "ci-gate passed"
