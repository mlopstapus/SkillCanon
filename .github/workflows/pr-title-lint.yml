name: PR Title Lint

# Blocks a badly-titled PR from merging, since release.yml (push-to-main) trusts
# the merged PR's title to decide the semver bump (fix: -> patch, feat: -> minor,
# a "!" or a BREAKING CHANGE: footer -> major). This has its own trigger (needs
# `edited`, so retitling an already-open PR re-checks it without re-running the
# heavier lint/typecheck/test/build jobs in ci.yml) and is intentionally a
# separate required check rather than a ci.yml job folded into ci-gate — see
# specs/039-pr-title-semver-versioning/research.md Decision 3.
on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [main]

permissions:
  pull-requests: read
  statuses: write

jobs:
  title-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Subject must be non-empty and not end with a period — kept loose
          # otherwise, since this only needs to gate the type/bump prefix that
          # release.yml actually parses.
          subjectPattern: ^(?!\s*$)(?!.*\.$).+$
          subjectPatternError: |
            The PR title's subject (after "type: ") must not be empty and must not end in a period.
          # "!" after the type/scope (e.g. "feat!:") is a standard Conventional
          # Commits breaking-change marker and is already accepted by this
          # action's default type/scope pattern — no extra config needed for it.
