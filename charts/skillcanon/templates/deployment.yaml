apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skillcanon.app.fullname" . }}
  labels:
    {{- include "skillcanon.labels" . | nindent 4 }}
    {{- include "skillcanon.app.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "skillcanon.app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skillcanon.app.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "skillcanon.app.fullname" . }}
          env:
            {{- if .Values.externalDatabase.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: database-url
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: auth-database-url
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: migration-database-url
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillcanon.app.fullname" . }}
                  key: database-url
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillcanon.app.fullname" . }}
                  key: auth-database-url
            # Present for parity with docker-compose.yaml's app service (it
            # lets an operator `kubectl exec` in and run `pnpm db:migrate`
            # by hand the same way `docker compose exec app pnpm db:migrate`
            # works today) — not used by the app's own runtime code paths.
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillcanon.app.fullname" . }}
                  key: migration-database-url
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillcanon.app.fullname" . }}
                  key: jwt-secret
            {{- if .Values.app.smtp.enabled }}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillcanon.app.fullname" . }}
                  key: smtp-pass
            {{- end }}
            {{- if .Values.app.github.enabled }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "skillcanon.app.fullname" . }}
                  key: github-token
            {{- end }}
          livenessProbe:
            # src/app/api/health/route.ts — dependency-free (no auth, no
            # DB round-trip), so a failure here means the Next.js server
            # process itself is down, not a downstream outage.
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
